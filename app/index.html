<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#1A2B4A" />
<!-- Fase 6 (tarefa 6.5, finding M-04). script-src precisa de 'unsafe-inline':
     o app inteiro é um único elemento SCRIPT inline (decisão AD-01 — arquivo único,
     sem bundler). Isso é uma lacuna real e documentada, não um descuido: CSP
     aqui protege contra (a) uma CDN comprometida servindo código diferente do
     esperado (mitigado também pelo SRI em cada tag SCRIPT com src abaixo) e (b)
     qualquer origem de script nova além de unpkg/cdnjs — mas NÃO contra uma
     injeção de SCRIPT inline via XSS refletido/armazenado. Reavaliar quando
     (e se) o projeto adotar um bundler. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" />
<title>Trippin — V1</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />
<script crossorigin="anonymous" integrity="sha384-DGyLxAyjq0f9SPpVevD6IgztCFlnMF6oW/XQGmfe+IsZ8TqEiDrcHkMLKI6fiB/Z" src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin="anonymous" integrity="sha384-gTGxhz21lVGYNMcdJOyq01Edg0jhn/c22nsx0kyqP0TxaV5WVdsSH1fSDUf5YJj1" src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="config.js"></script>
<script src="src/trippin-api.js"></script>
<!-- pdf.js carregado sob demanda -->
<style>
  :root{
    --ink:#14213D; --deep:#1A2B4A; --coral:#FF6B5C; --coral-d:#E85746;
    --lagoon:#2DB5A3; --sand:#F7F5F0; --amber:#F4A259; --danger:#D9534F; --sky:#5B8DEF; --violet:#9B7BE0;
    --line:#E4E0D6; --muted:#6B7A90; --card:#FFFFFF; --shadow:0 6px 24px rgba(20,33,61,.10);
    --info-bg:#eef5ff; --info-line:#b9d4ff; --stay-bg:#fff4ec; --stay-line:#ffd9bd;
    --warn-bg:#fffaf3; --warn-line:#f4c98a; --cor-bg:#fff5f3; --cor-line:#ffc9c1;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:'Inter',system-ui,sans-serif;background:#E9E5DC;color:var(--ink);
    display:flex;justify-content:center;min-height:100vh}
  #root{width:100%;background:var(--sand);min-height:100vh;min-height:100dvh;
    position:relative;overflow:hidden;
    padding-top:env(safe-area-inset-top,0px)}
  /* celular: ocupa a largura toda (sem bordas claras nas laterais).
     desktop: centraliza num cartão de 430px com sombra. */
  @media (min-width:700px){
    #root{max-width:430px;box-shadow:0 0 60px rgba(0,0,0,.12)}
    .bottombar{max-width:430px}
  }
  h1,h2,h3,h4,.display{font-family:'Sora',sans-serif;margin:0}
  .mono{font-family:'JetBrains Mono',monospace}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  input,select{font-family:inherit;font-size:15px}
  .screen{padding:0 0 90px;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
  /* sheet: mantém o translateY(-50%) durante o pop (senão "salta" do canto p/ o centro) */
  @keyframes popsheet{from{opacity:0;transform:translateY(-50%) scale(.94)}to{opacity:1;transform:translateY(-50%) scale(1)}}
  @keyframes slideL{from{transform:translateX(-100%)}to{transform:translateX(0)}}
  @keyframes slideR{from{transform:translateX(100%)}to{transform:translateX(0)}}

  /* App bar */
  .appbar{position:sticky;top:0;z-index:30;background:var(--sand);color:var(--ink);
    display:flex;align-items:center;gap:10px;padding:12px 14px;}
  .appbar .ttl{font-family:'Sora';font-weight:800;font-size:15px;flex:0 1 auto;margin:0 auto;text-align:center;
    background:var(--card);color:var(--coral);padding:8px 18px;border-radius:14px;box-shadow:var(--shadow);
    max-width:62%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .iconbtn{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;color:var(--ink);background:var(--card);box-shadow:0 2px 8px rgba(20,33,61,.07);font-size:18px;position:relative}
  .iconbtn:active{background:var(--line)}
  .badge{position:absolute;top:-3px;right:-3px;background:var(--coral);color:#fff;
    font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;font-family:'Inter'}

  .pad{padding:20px 18px}
  .eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);
    font-weight:700;margin-bottom:6px}
  .muted{color:var(--muted)}
  .sub{color:var(--muted);font-size:14px;line-height:1.5}

  /* Buttons */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 18px;border-radius:14px;font-weight:600;font-size:15px;width:100%;
    transition:transform .08s}
  .btn:active{transform:scale(.98)}
  .btn-primary{background:var(--coral);color:#fff;box-shadow:0 6px 16px rgba(255,107,92,.32)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn-lagoon{background:var(--lagoon);color:#fff}
  .btn-danger{background:#fff;color:var(--danger);border:1.5px solid #f0caca}
  .btn:disabled{opacity:.45;pointer-events:none}

  /* Fields */
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--ink)}
  .field .req{color:var(--coral)}
  .inp{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:12px;
    background:#fff;outline:none;transition:border .15s}
  .inp:focus{border-color:var(--lagoon)}
  .inp.err{border-color:var(--danger)}
  .errmsg{color:var(--danger);font-size:12px;margin-top:5px}
  .row{display:flex;gap:10px}

  /* Cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .tripcard{position:relative;overflow:hidden;border-radius:20px;color:#fff;padding:18px;
    margin-bottom:14px;box-shadow:var(--shadow);min-height:120px;
    background:linear-gradient(135deg,#1A2B4A,#23406b)}
  .tripcard.past{background:linear-gradient(135deg,#4a4a52,#6b6b78)}
  .stamp{position:absolute;top:14px;right:14px;border:2px solid rgba(255,255,255,.55);
    color:rgba(255,255,255,.92);font-family:'Sora';font-weight:700;font-size:10px;
    letter-spacing:.1em;padding:4px 9px;border-radius:6px;transform:rotate(6deg);text-transform:uppercase}
  .tripcode{font-size:11px;opacity:.7;margin-top:2px;display:flex;align-items:center;gap:6px}
  .copybtn{background:rgba(255,255,255,.15);border-radius:6px;padding:2px 7px;font-size:10px;color:#fff}

  .opt{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);
    border-radius:16px;padding:16px;margin-bottom:12px;width:100%;text-align:left}
  .opt:active{background:#fafafa}
  .opt .ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;
    justify-content:center;font-size:20px;flex-shrink:0}
  .opt .tx{flex:1}
  .opt .tx b{display:block;font-size:15px}
  .opt .tx span{font-size:12.5px;color:var(--muted)}
  .opt .arr{color:var(--muted)}

  /* Tabs (trip) */
  .tabbar{position:sticky;top:66px;z-index:20;background:var(--sand);display:flex;
    gap:6px;padding:10px 12px;overflow-x:auto;overflow-y:hidden;border-bottom:1px solid var(--line);
    flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabbar::-webkit-scrollbar{display:none}
  .tab{padding:8px 14px;border-radius:20px;font-size:13px;font-weight:600;color:var(--muted);
    white-space:nowrap;background:#fff;border:1px solid var(--line);flex:0 0 auto}
  .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  /* Calendar */
  .calhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .segbtns{display:flex;background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .segbtns button{padding:7px 12px;font-size:12.5px;font-weight:600;color:var(--muted)}
  .segbtns button.on{background:var(--ink);color:#fff}
  .navarrow{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink)}
  .daygrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
  .dcell{aspect-ratio:1;border-radius:10px;background:#fff;border:1px solid var(--line);
    padding:4px;font-size:11px;position:relative;overflow:hidden}
  .dcell .dn{font-weight:700;font-size:11px}
  .dcell.dim{opacity:.35}
  .dcell .dot{width:6px;height:6px;border-radius:50%;background:var(--lagoon);position:absolute;bottom:5px;left:5px}
  /* bolinha verde: marca o dia de hoje (mês e semana) */
  .tdot{width:8px;height:8px;border-radius:50%;background:#27AE60;display:inline-block;box-shadow:0 0 0 2px rgba(39,174,96,.28);flex-shrink:0}
  .dcell .tdot{position:absolute;top:4px;right:4px}
  .wkday .wd .tdot{margin-right:6px}
  .dcell .stay{position:absolute;bottom:4px;right:4px;font-size:9px}
  .tslot{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .tslot .tm{font-size:12px;color:var(--muted);width:48px;flex-shrink:0;font-weight:600}
  .actblk{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--lagoon);
    border-radius:10px;padding:10px 12px;flex:1;margin-bottom:6px;position:relative}
  .blkbtns{position:absolute;top:8px;right:8px;display:flex;gap:6px}
  .blkbtn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:13px;background:#f1ede4;color:var(--ink)}
  .blkbtn.del{background:#ffece9;color:var(--danger)}
  .blkbtn:active{opacity:.7}
  .typetag{display:inline-block;font-size:10px;font-weight:700;color:var(--lagoon);background:#e7f7f4;
    padding:2px 7px;border-radius:6px;margin-bottom:4px}
  .actblk .adesc{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.4}
  /* location marker (small block at top of day / on week & month) */
  .locmark{display:flex;align-items:center;gap:7px;color:#fff;font-weight:700;font-size:12.5px;
    padding:7px 12px;border-radius:10px;margin-bottom:12px;box-shadow:0 3px 10px rgba(20,33,61,.12)}
  .locchip{display:inline-flex;align-items:center;gap:4px;color:#fff;font-weight:700;font-size:10px;
    padding:2px 8px;border-radius:20px}
  /* hospedagem no cronograma (junto ao pin de localização, acima dos horários) */
  .lodgemark{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--coral);
    border-radius:12px;padding:10px 12px;margin-bottom:12px;cursor:pointer}
  .lodgemark .lh{display:flex;align-items:center;gap:9px}
  .lodgemark .lhi{font-size:18px}
  .lodgemark .lht{flex:1;min-width:0}
  .lodgemark .lht b{font-size:13.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lodgemark .lht span{font-size:11px;color:var(--muted)}
  .lodgemark .chev{color:var(--muted);font-size:12px}
  .lodgedetails{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .lodgedetails .lf{font-size:12px}
  .lodgedetails .lf .k{font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .lodgedetails .lf .v{font-weight:600}
  .lodgedetails .full{grid-column:1 / -1}
  /* week view: vertical day cards with time column */
  .wkday{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
  .wkday .wkh{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;
    background:#faf8f3;border-bottom:1px solid var(--line)}
  .wkday .wkh .wd{font-family:'Sora';font-weight:700;font-size:14px}
  .wkday .wkh .wdsub{font-size:11px;color:var(--muted)}
  .wkday.today .wkh{background:#eef5ff}
  .wkrow{display:flex;gap:10px;padding:8px 12px;border-bottom:1px solid #f0ece3}
  .wkrow:last-child{border-bottom:none}
  .wkrow .wt{font-size:11px;color:var(--muted);font-weight:600;width:42px;flex-shrink:0;padding-top:2px}
  .wkrow .wblk{flex:1;font-size:13px;border-left:3px solid var(--lagoon);padding-left:8px;line-height:1.3}
  .wkrow .wblk .wbt{font-size:11px;color:var(--muted)}
  .wkempty{padding:12px;font-size:12.5px;color:var(--muted);text-align:center}
  /* itinerário interpretado (cards de etapa) */
  .stageWrap{position:relative;padding-left:26px;margin-bottom:12px}
  .stageWrap:before{content:'';position:absolute;left:9px;top:6px;bottom:-12px;width:2px;background:var(--line)}
  .stageWrap:last-child:before{display:none}
  .dotmark{position:absolute;left:3px;top:6px;width:14px;height:14px;border-radius:50%;border:3px solid var(--sand);box-shadow:0 0 0 2px var(--line)}
  .stagebox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px;box-shadow:var(--shadow)}
  .stagebox .sbadge{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:6px;color:#fff;margin-bottom:6px}
  .stagebox .scity{font-family:'Sora';font-weight:700;font-size:16px}
  .stagebox .siata{font-family:'JetBrains Mono';font-weight:700;font-size:12px;color:var(--muted);margin-left:5px}
  .stagebox .sair{font-size:11.5px;color:var(--muted);margin-top:1px}
  .stagebox .stimes{display:flex;gap:16px;margin-top:9px;flex-wrap:wrap}
  .stagebox .slab{font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .stagebox .sval{font-family:'JetBrains Mono';font-weight:700;font-size:15px}
  .stagebox .sdt{font-size:10px;color:var(--muted)}
  .stagebox .slay{display:flex;align-items:center;gap:6px;background:#fffaf3;border:1px solid var(--amber);border-radius:9px;padding:6px 10px;margin-top:9px;font-size:12px;font-weight:600;color:#9a5b13}
  .sfly{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:700;padding:3px 8px;border-radius:20px;background:#eef5ff;color:#2c5dc7;margin:8px 6px 0 0}
  .actblk.conflict{border-left-color:var(--amber);background:#fffaf3}
  .actblk b{font-size:14px}
  .actblk .meta{font-size:12px;color:var(--muted);margin-top:2px}
  .joinbtn{margin-top:8px;font-size:12px;font-weight:600;color:var(--lagoon);
    border:1px solid var(--lagoon);border-radius:8px;padding:5px 10px;background:#fff}
  .joinbtn.joined{background:var(--lagoon);color:#fff}

  .alert{background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:14px;padding:14px;
    margin-bottom:14px;display:flex;gap:12px}
  .alert .ai{font-size:20px}
  .alert b{font-size:14px;display:block;margin-bottom:3px}
  .alert p{margin:0;font-size:13px;color:var(--muted)}

  /* Docs */
  .subtabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .subtab{padding:8px 13px;border-radius:11px;font-size:13px;font-weight:600;background:#fff;
    border:1px solid var(--line);color:var(--muted)}
  .subtab.on{background:var(--lagoon);color:#fff;border-color:var(--lagoon)}
  .docitem{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
    border-radius:13px;padding:13px;margin-bottom:10px}
  .docitem .di{font-size:22px}
  .docitem .dt{flex:1}
  .docitem .dt b{font-size:14px;display:block}
  .docitem .dt span{font-size:12px;color:var(--muted)}
  .offline{font-size:10px;font-weight:700;color:var(--lagoon);background:#e7f7f4;
    padding:3px 7px;border-radius:6px;display:inline-flex;align-items:center;gap:3px}

  /* members */
  .member{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);
    border-radius:13px;padding:12px;margin-bottom:10px}
  .ava{width:42px;height:42px;border-radius:50%;background:var(--lagoon);color:#fff;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
  .ava.adm{background:var(--coral)}
  .admtag{font-size:10px;font-weight:700;color:var(--coral);background:#ffecea;padding:2px 7px;border-radius:6px}

  /* gallery */
  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .gal .ph{aspect-ratio:1;border-radius:10px;background:linear-gradient(135deg,#cfe6e2,#a9d4cd);
    display:flex;align-items:center;justify-content:center;font-size:22px;color:#2c6e64}

  /* suggestions */
  .sug{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:13px;
    padding:13px;margin-bottom:10px}
  .sug .si{width:46px;height:46px;border-radius:11px;background:#f1ede4;display:flex;
    align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
  .sug .st{flex:1}
  .sug .st b{font-size:14px;display:block}
  .sug .st .rt{font-size:12px;color:var(--amber);font-weight:600}
  .sug .st span{font-size:12px;color:var(--muted)}

  /* expenses */
  .expense{display:flex;align-items:center;justify-content:space-between;background:#fff;
    border:1px solid var(--line);border-radius:13px;padding:13px;margin-bottom:10px}
  .expense .el b{font-size:14px;display:block}
  .expense .el span{font-size:12px;color:var(--muted)}
  .expense .ev{font-family:'JetBrains Mono';font-weight:600;color:var(--ink)}
  .pchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:#fff;border-radius:18px;
    padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--muted);user-select:none}
  .pchip.on{background:var(--lagoon);border-color:var(--lagoon);color:#fff}
  .pchip .pp{font-size:11px;font-family:'JetBrains Mono';opacity:.95}
  .settle{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);
    border-radius:11px;padding:11px 13px;margin-bottom:8px;font-size:13.5px}
  .settle .amt{font-family:'JetBrains Mono';font-weight:700;color:var(--coral)}
  .balrow{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;font-size:13.5px;border-bottom:1px solid var(--line)}
  .balrow:last-child{border-bottom:none}
  .balrow .pos{color:#1d8e7d;font-weight:700;font-family:'JetBrains Mono'}
  .balrow .neg{color:var(--danger);font-weight:700;font-family:'JetBrains Mono'}
  .balrow .zero{color:var(--muted);font-family:'JetBrains Mono'}
  /* rotas / co-localização */
  .viewsel{display:flex;align-items:center;gap:8px;margin-bottom:14px}
  .viewsel select{flex:1;border:1.5px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--card);font-weight:600;font-size:14px;color:var(--ink)}
  .viewsel select option{background:var(--card);color:var(--ink)}
  .tl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:#fff;padding:10px;-webkit-overflow-scrolling:touch}
  .tl-row{display:flex;align-items:center;margin-bottom:5px}
  .tl-row:last-child{margin-bottom:0}
  .tl-name{flex:0 0 72px;font-size:11.5px;font-weight:700;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
  .tl-cells{display:flex;gap:2px}
  .tl-cell{width:22px;height:26px;border-radius:5px;flex:0 0 auto;position:relative}
  .tl-cell.meet{box-shadow:0 0 0 2px var(--gold)}
  .tl-cell .mk{position:absolute;top:-4px;right:-2px;font-size:9px}
  .tl-head .tl-cell{height:auto;background:none !important;font-size:9.5px;text-align:center;color:var(--muted);font-weight:700;box-shadow:none}
  .meetcard{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 13px;margin-bottom:8px}
  .meetcard .av{width:34px;height:34px;border-radius:50%;background:var(--lagoon);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
  .meetcard .mm{min-width:0}
  .meetcard .mm b{font-size:13.5px;display:block}
  .meetcard .mm span{font-size:11.5px;color:var(--muted)}
  .meetcard .cnt{margin-left:auto;text-align:right;font-family:'JetBrains Mono';font-weight:700;color:var(--coral);font-size:12.5px;flex-shrink:0;white-space:nowrap}
  /* check-in da passagem (card do documento) */
  .checkin{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
  .ci-row{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .ci-row .mono{color:var(--ink);font-weight:700;font-family:'JetBrains Mono'}
  .copybtn{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:2px 8px;font-size:12px;cursor:pointer;color:var(--ink)}
  .copybtn:active{transform:scale(.94)}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:20px;padding:6px 12px;font-size:13px;margin:0 6px 6px 0}
  .chip .x{color:var(--danger);font-weight:700}
  .dest{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);
    border-radius:13px;padding:12px;margin-bottom:10px}
  .dest .pin{font-size:18px}
  .dest .dd{flex:1}
  .dest .dd b{font-size:14px;display:block}
  .dest .dd span{font-size:12px;color:var(--muted)}

  /* search dropdown */
  .searchwrap{position:relative}
  .results{position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);
    border-radius:12px;margin-top:4px;box-shadow:var(--shadow);z-index:10;overflow:hidden}
  .results button{display:block;width:100%;text-align:left;padding:12px 14px;font-size:14px;
    border-bottom:1px solid var(--line)}
  .results button:active{background:#f6f6f6}

  /* sticky footer actions (new trip) */
  .footactions{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;
    max-width:430px;display:flex;gap:10px;padding:14px 16px;background:linear-gradient(transparent,var(--sand) 30%);z-index:20}

  /* drawer + notif overlay */
  .overlay{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:430px;
    background:rgba(20,33,61,.10);z-index:50;animation:fade .2s}
  .drawer{position:absolute;top:0;left:0;bottom:0;width:78%;max-width:320px;background:var(--sand);
    box-shadow:8px 0 30px rgba(0,0,0,.2);animation:slideL .25s ease;display:flex;flex-direction:column}
  /* notificações: aba lateral ancorada à direita, ocupando ~metade da tela e altura cheia */
  .notifpanel{position:absolute;top:0;right:0;left:auto;bottom:0;width:50%;min-width:208px;max-width:300px;background:var(--sand);
    box-shadow:-6px 0 30px rgba(20,33,61,.28);animation:slideR .3s cubic-bezier(0.16,1,0.3,1);display:flex;flex-direction:column;
    border-radius:18px 0 0 18px;overflow:hidden}
  .notifpanel .appbar{padding:12px 10px}
  .notifpanel .ttl{font-size:13px;padding:6px 10px;max-width:none}
  /* map canvas (aba Mapa) — fundo claro estilo mapa com pinos e ícone de transporte */
  .mapcanvas{position:relative;background:#e8f1fb;
    background-image:radial-gradient(rgba(91,141,239,.20) 1.1px,transparent 1.6px);
    background-size:15px 15px;border-radius:16px;padding:20px 8px 14px;overflow-x:auto;overflow-y:hidden}
  .maprow{display:flex;align-items:flex-start;min-width:min-content}
  .mapstop{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:84px;text-align:center}
  .mappin{cursor:pointer;line-height:0;filter:drop-shadow(0 3px 5px rgba(20,33,61,.22))}
  .mapcity{margin-top:6px;background:#fff;border-radius:8px;padding:3px 7px;font-size:11px;font-weight:700;color:var(--ink);
    max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 3px rgba(20,33,61,.12)}
  .maprole{margin-top:3px;font-size:8.5px;color:#5a6b86;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
  .mapconn{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;flex:0 0 auto;width:44px;padding-top:9px}
  .mapconn .ic{font-size:17px;line-height:1;margin-bottom:3px;height:18px}
  .mapconn .ln{width:100%;border-top:2.5px dashed var(--sky);opacity:.7}
  #root[data-theme="dark"] .mapcanvas{background:#16243e;background-image:radial-gradient(rgba(120,160,230,.18) 1.1px,transparent 1.6px)}
  #root[data-theme="dark"] .mapcity{background:var(--card);color:#e8edf6}
  #root[data-theme="dark"] .maprole{color:#9fb0cc}
  .drawer .dh{background:var(--deep);color:#fff;padding:22px 18px}
  .drawer .dh .ava{width:54px;height:54px;font-size:20px;margin-bottom:10px}
  .navitem{display:flex;align-items:center;gap:13px;padding:15px 18px;font-size:15px;font-weight:500;color:var(--ink)}
  .navitem:active{background:#efeae0}
  .navitem .ni{width:24px;text-align:center;font-size:17px}

  .notifitem{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px 36px 13px 13px;margin-bottom:10px;position:relative}
  .notifitem.unread{border-left:4px solid var(--coral)}
  .notifitem p{margin:0 0 8px;font-size:13.5px;line-height:1.45}
  .notifitem .nt{font-size:11px;color:var(--muted)}
  .notifitem .dismiss{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:50%;background:#f1ede4;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;line-height:1}

  /* modal */
  .modal{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;width:100%;max-width:430px;
    background:rgba(20,33,61,.12);z-index:60;display:flex;align-items:center;justify-content:center;
    padding:16px;animation:fade .2s}
  .modalbox{background:#fff;border-radius:24px;padding:24px 20px;width:100%;animation:pop .2s ease;text-align:center;
    box-shadow:0 16px 48px rgba(20,33,61,.22)}
  .modalbox .mi{font-size:34px;margin-bottom:8px}
  .modalbox h3{font-size:18px;margin-bottom:8px}
  .modalbox p{font-size:14px;color:var(--muted);margin:0 0 20px;line-height:1.5}

  /* toast */
  .toast{position:fixed;bottom:96px;left:0;right:0;margin:0 auto;width:max-content;max-width:90%;background:var(--ink);
    color:#fff;padding:13px 20px;border-radius:30px;font-size:14px;font-weight:500;z-index:70;
    box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .2s;display:flex;align-items:center;gap:8px}

  /* lang grid */
  .langgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .langbtn{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:14px;
    text-align:left;display:flex;align-items:center;gap:10px}
  .langbtn.on{border-color:var(--coral);background:#fff5f3}
  .langbtn .fl{font-size:24px}
  .langbtn .ln{font-size:13.5px;font-weight:600}
  .langbtn .lc{font-size:11px;color:var(--muted)}

  .hero{background:linear-gradient(160deg,#1A2B4A,#2c4a72);color:#fff;padding:32px 22px 26px;
    border-radius:0 0 26px 26px}
  .hero .logo{font-family:'Sora';font-weight:800;font-size:30px;letter-spacing:-.02em}
  .hero .logo .dot{color:var(--coral)}
  .hero p{margin:6px 0 0;opacity:.8;font-size:14px}

  .photoadd{width:84px;height:84px;border-radius:50%;border:2px dashed var(--line);
    display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);
    margin:0 auto 18px;background:#fff}
  .empty{text-align:center;padding:40px 20px;color:var(--muted)}
  .empty .ei{font-size:40px;margin-bottom:10px}
  .sectiontitle{font-family:'Sora';font-weight:700;font-size:16px;margin:18px 0 12px}
  .pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:#e7f7f4;color:var(--lagoon)}

  /* ===== Barra inferior de navegação ===== */
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
  .bottombar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;
    background:var(--card);display:flex;align-items:center;justify-content:space-around;
    padding:9px 26px calc(12px + env(safe-area-inset-bottom,0px));z-index:46;border-radius:22px 22px 0 0;border-top:1px solid var(--line);
    box-shadow:0 -6px 22px rgba(20,33,61,.10)}
  .bnav{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
    font-size:10px;font-weight:600;position:relative;background:none;border:none;cursor:pointer}
  .bnav:active{color:var(--coral)}
  .bnav .bic{font-size:20px;line-height:1}
  .bnav .badge{top:-5px;right:8px}
  .bnav.center{background:var(--coral);color:#fff;width:54px;height:54px;border-radius:50%;justify-content:center;
    margin-top:-22px;box-shadow:0 6px 16px rgba(255,107,92,.4);border:4px solid var(--card)}
  .bnav.center .bic{font-size:23px}

  /* ===== Menu full-screen (de baixo para cima) ===== */
  .menusheet{position:absolute;inset:0;background:var(--sand);z-index:60;display:flex;flex-direction:column;
    animation:slideUp .28s ease}
  .menusheet .mh{background:var(--deep);color:#fff;padding:20px 18px;display:flex;align-items:center;gap:14px}
  .menusheet .mh .ava{width:50px;height:50px;font-size:19px}
  .menusheet .closex{margin-left:auto;width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.12);
    color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
  .menusheet .mlist{flex:1;overflow-y:auto;padding:8px 0 90px}

  /* ===== Configurações ===== */
  .setrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:11px}
  .setrow .si{width:40px;height:40px;border-radius:11px;background:#eef2f7;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
  .setrow .st{flex:1}
  .setrow .st b{display:block;font-size:14px}
  .setrow .st span{font-size:12px;color:var(--muted)}
  .switch{width:46px;height:27px;border-radius:20px;background:#d4cfc4;position:relative;transition:background .2s;flex-shrink:0;cursor:pointer}
  .switch.on{background:var(--lagoon)}
  .switch:after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch.on:after{left:22px}
  .segpick{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden}
  .segpick button{flex:1;padding:9px;font-size:13px;font-weight:600;color:var(--muted);background:none;border:none}
  .segpick button.on{background:var(--ink);color:#fff}

  /* ===== Apps de viagem ===== */
  .appcard{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:13px;margin-bottom:11px}
  .appcard .ai{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:23px;flex-shrink:0}
  .appcard .at{flex:1}
  .appcard .at b{display:block;font-size:14px}
  .appcard .at span{font-size:12px;color:var(--muted)}
  .appcard .soon{font-size:10px;font-weight:700;color:var(--muted);background:#eee9df;padding:3px 8px;border-radius:6px}

  /* ===== Galeria com imagens reais ===== */
  .galimg{aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center;background-color:#cfe6e2}
  .galadd{aspect-ratio:1;border-radius:10px;background:var(--card);border:1.5px dashed var(--line);color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer}

  /* ===== Visualizador de documento ===== */
  .docviewer{position:absolute;inset:0;background:rgba(10,16,28,.96);z-index:70;display:flex;flex-direction:column;animation:fade .2s}
  .docviewer .dvh{display:flex;align-items:center;gap:8px;padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .docviewer .dvt{flex:1;color:#fff;font-weight:700;font-size:14px;font-family:'Sora';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .docviewer .dvb{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .docviewer .dvb:active{background:rgba(255,255,255,.3)}
  .docviewer .dvbody{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;padding:10px}
  .docviewer .dvbody img{max-width:100%;max-height:100%;border-radius:10px;object-fit:contain}
  .docviewer .dvbody iframe{width:100%;height:100%;border:none;border-radius:10px;background:#fff}
  .docviewer .dvempty{color:#c9d4e6;text-align:center;font-size:14px;padding:30px 20px;line-height:1.5}

  /* ===== Peek (pré-visualização ao segurar) ===== */
  .docitem.peeking{outline:2px solid var(--coral);outline-offset:-2px}
  .docpeek{position:absolute;inset:0;background:rgba(10,16,28,.82);z-index:75;display:flex;align-items:center;justify-content:center;padding:24px;animation:fade .12s}
  .docpeekcard{width:100%;max-width:360px;max-height:76%;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);display:flex;flex-direction:column;animation:pop .14s ease}
  .docpeekcard img{width:100%;max-height:60vh;object-fit:contain;background:#f3f3f3}
  .docpeekcard iframe{width:100%;height:60vh;border:none;background:#fff}
  .docpeekempty{padding:40px 20px;text-align:center;font-size:15px;color:var(--ink);font-weight:600}
  .docpeektag{padding:10px;text-align:center;font-size:12px;font-weight:700;color:var(--muted);background:var(--sand);border-top:1px solid var(--line)}
  /* item sendo arrastado no reorder por segurar */
  .dragging{opacity:.65;box-shadow:0 10px 28px rgba(20,33,61,.28);transform:scale(1.02);position:relative;z-index:5}
  .reorderhint{font-size:11px;color:var(--muted);text-align:center;margin:2px 0 10px}

  /* ===== "x" para excluir viagem (admin) ===== */
  .cardx{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:9px;background:rgba(0,0,0,.28);
    color:#fff;font-size:15px;display:flex;align-items:center;justify-content:center;z-index:2;border:none}
  .cardx:active{background:rgba(0,0,0,.5)}

  /* ===== Tema escuro ===== */
  #root[data-theme="dark"]{--sand:#151d2c;--ink:#E6ECF5;--card:#1c2740;--line:#2c3a55;--muted:#9aabc4;--deep:#0f1726;--sky:#6f9bf0;--violet:#a98fe6;
    --info-bg:#16243e;--info-line:#2c4a72;--stay-bg:#2a2113;--stay-line:#5a3e10;--warn-bg:#252010;--warn-line:#5a3e10;--cor-bg:#2a1515;--cor-line:#5a2a2a;
    background:#151d2c;color:#E6ECF5}
  /* --- Correção raiz: força herança de cor dentro do #root --- */
  #root[data-theme="dark"] .card,#root[data-theme="dark"] .inp,#root[data-theme="dark"] .opt,
  #root[data-theme="dark"] .tab,#root[data-theme="dark"] .subtab,#root[data-theme="dark"] .docitem,
  #root[data-theme="dark"] .member,#root[data-theme="dark"] .dest,#root[data-theme="dark"] .wkday,
  #root[data-theme="dark"] .stagebox,#root[data-theme="dark"] .dcell,#root[data-theme="dark"] .expense,
  #root[data-theme="dark"] .sug,#root[data-theme="dark"] .modalbox,#root[data-theme="dark"] .navarrow,
  #root[data-theme="dark"] .segbtns,#root[data-theme="dark"] .wkday .wkh,#root[data-theme="dark"] .langbtn,
  #root[data-theme="dark"] .notifitem,#root[data-theme="dark"] .setrow,#root[data-theme="dark"] .setrow .si,
  #root[data-theme="dark"] .appcard .ai,#root[data-theme="dark"] .actblk,#root[data-theme="dark"] .lodgemark,
  #root[data-theme="dark"] .albumcard,#root[data-theme="dark"] .bottombar{
    background:var(--card);color:var(--ink);border-color:var(--line)}
  /* --- Botões --- */
  #root[data-theme="dark"] .btn-ghost{background:#202c45;color:var(--ink);border-color:#33446a}
  #root[data-theme="dark"] .btn-dark{background:#33446a;color:#fff}
  #root[data-theme="dark"] .btn-primary{color:#fff}
  #root[data-theme="dark"] .btn-danger{background:var(--card);color:#ff8576;border-color:#5a2a2a}
  #root[data-theme="dark"] .tab.on{background:var(--coral);color:#fff;border-color:var(--coral)}
  #root[data-theme="dark"] .blkbtn{background:#2c3a55;color:var(--ink)}
  #root[data-theme="dark"] .blkbtn.del{background:#3a1f1f;color:#ff8576}
  #root[data-theme="dark"] .navarrow{background:#202c45;color:var(--ink);border-color:#33446a}
  #root[data-theme="dark"] .joinbtn{background:#202c45;color:#5fd6c4;border-color:#2db5a3}
  #root[data-theme="dark"] .joinbtn.joined{background:var(--lagoon);color:#fff}
  /* --- Chips e tags --- */
  #root[data-theme="dark"] .typetag{background:#173a35;color:#5fd6c4}
  #root[data-theme="dark"] .offline{background:#173a35;color:#5fd6c4}
  #root[data-theme="dark"] .admtag{background:#3a1a1a;color:#ff8576}
  #root[data-theme="dark"] .pill{background:#173a35;color:#5fd6c4}
  #root[data-theme="dark"] .chip{background:var(--card);border-color:var(--line);color:var(--ink)}
  #root[data-theme="dark"] .appcard .soon{background:#253550;color:var(--muted)}
  /* --- Cronograma --- */
  #root[data-theme="dark"] .actblk b,.actblk .actblk b{color:inherit}
  #root[data-theme="dark"] .actblk.conflict{background:#252010;border-left-color:var(--amber)}
  #root[data-theme="dark"] .wkday .wkh{background:#19243a;border-bottom-color:var(--line)}
  #root[data-theme="dark"] .wkday.today .wkh{background:#16203a}
  #root[data-theme="dark"] .wkrow{border-bottom-color:var(--line)}
  #root[data-theme="dark"] .stagebox .slay{background:#251e0d;border-color:#5a3e10;color:#e8a840}
  #root[data-theme="dark"] .sfly{background:#162040;color:#7ab0f0}
  /* --- Formulários e resultados --- */
  #root[data-theme="dark"] select.inp option{background:#1c2740}
  #root[data-theme="dark"] .results{background:var(--card);border-color:var(--line)}
  #root[data-theme="dark"] .results button{border-bottom-color:var(--line);color:var(--ink)}
  #root[data-theme="dark"] .results button:active{background:#253550}
  #root[data-theme="dark"] .photoadd{background:#202c45;border-color:var(--line)}
  /* --- Modais e sheets --- */
  #root[data-theme="dark"] .toast{background:var(--card);color:#ff8576;border:1px solid #33446a}
  #root[data-theme="dark"] .modalbox{background:var(--card);color:var(--ink)}
  #root[data-theme="dark"] .modalbox p{color:var(--muted)}
  #root[data-theme="dark"] .modalbox h3{color:#ff8576}
  #root[data-theme="dark"] .sheet{background:var(--card)}
  #root[data-theme="dark"] .sheeth{color:#ff8576}
  /* --- Configurações e menus --- */
  #root[data-theme="dark"] .segbtns{background:var(--card)}
  #root[data-theme="dark"] .segbtns button.on{background:var(--coral);color:#fff}
  #root[data-theme="dark"] .segpick{background:#202c45}
  #root[data-theme="dark"] .segpick button{color:var(--muted)}
  #root[data-theme="dark"] .segpick button.on{background:var(--card);color:#ff8576}
  #root[data-theme="dark"] .navitem:active{background:#202c45}
  #root[data-theme="dark"] .setrow .si{background:#253550}
  /* --- Idiomas --- */
  #root[data-theme="dark"] .langbtn{background:#202c45;border-color:#33446a}
  #root[data-theme="dark"] .langbtn.on{background:#2a1515;border-color:var(--coral);color:#ff8576}
  /* --- Vários --- */
  #root[data-theme="dark"] .empty,#root[data-theme="dark"] .ph{background:var(--card);color:var(--ink);border-color:var(--line)}
  #root[data-theme="dark"] .alert{color:var(--ink)}
  #root[data-theme="dark"] .alert p{color:var(--muted)}
  #root[data-theme="dark"] .alert b{color:var(--ink)}
  #root[data-theme="dark"] .opt .ic,#root[data-theme="dark"] .srcopt .si{background:#253550}
  #root[data-theme="dark"] .opt b,#root[data-theme="dark"] .langbtn .ln,#root[data-theme="dark"] .setrow .st b{color:var(--ink)}
  #root[data-theme="dark"] .srcopt b{color:var(--ink)}
  #root[data-theme="dark"] .opt .ic,#root[data-theme="dark"] .albumthumb{border-color:var(--card)}

"use strict";
const { useState, useEffect, useRef } = React;
/* Fase 6 (tarefa 6.3) — telemetria de erro do cliente. TrippinAPI.log.error()
   já existia (Fase 2A) mas nunca era chamado; liga aqui. Sem efeito em modo
   local (log.error() só grava se mode==='remote'). Contexto é só tela +
   id da viagem (window._trippinScreen, atualizado por App()) — nunca o corpo
   do erro além de message/stack, que já é o que log.error() grava; nenhum
   dado de formulário, e-mail ou documento passa por aqui. */
window.addEventListener('error', e => {
    TrippinAPI.log.error(e.error || e.message, { kind: 'onerror', ...(window._trippinScreen || {}) });
});
window.addEventListener('unhandledrejection', e => {
    TrippinAPI.log.error(e.reason, { kind: 'promise', ...(window._trippinScreen || {}) });
});
/* ---------------- reorder por arrastar após segurar (long-press) ----------------
   Hook de container: coordena UMA lista arrastável. Ao segurar `holdMs` sobre um item,
   entra em modo arraste; enquanto arrasta, reordena visualmente; ao soltar, confirma.
   `axis` = 'y' (álbuns, vertical) ou 'x' (mapa, horizontal). `onCommit(newOrder)` recebe
   o array de ids reordenado. Funciona com mouse e toque (Pointer Events). */
function useHoldReorder({ ids, onCommit, axis = 'y', holdMs = 380 }) {
    const [dragId, setDragId] = useState(null);
    const [order, setOrder] = useState(null); // ordem provisória durante o arraste
    const timer = useRef(null);
    const startPt = useRef(null);
    const orderRef = useRef(null);
    const nodes = useRef({}); // id -> elemento DOM (para achar sobre quem estamos)
    const clearTimer = () => { if (timer.current) { clearTimeout(timer.current); timer.current = null; } };
    const setNode = (id) => (el) => { if (el) nodes.current[id] = el; else delete nodes.current[id]; };
    const begin = (id) => (e) => {
        if (e.target.closest('button, input, a, select, textarea')) return; // segurar um controle não inicia arraste
        startPt.current = { x: e.clientX, y: e.clientY };
        clearTimer();
        timer.current = setTimeout(() => {
            orderRef.current = ids.slice();
            setOrder(ids.slice());
            setDragId(id);
            if (navigator.vibrate) try { navigator.vibrate(15); } catch (_) {}
        }, holdMs);
    };
    const move = (e) => {
        if (!dragId) {
            // ainda não entrou em arraste: se mexeu muito, cancela o hold (era rolagem)
            if (startPt.current && (Math.abs(e.clientX - startPt.current.x) > 12 || Math.abs(e.clientY - startPt.current.y) > 12)) clearTimer();
            return;
        }
        if (e.cancelable) e.preventDefault();
        const cur = orderRef.current || [];
        const p = axis === 'y' ? e.clientY : e.clientX;
        // acha o item cujo CENTRO no eixo está mais próximo do ponteiro (robusto: não exige
        // que o ponteiro esteja exatamente dentro do retângulo do alvo)
        let overId = null, best = Infinity;
        for (const id of cur) {
            const el = nodes.current[id];
            if (!el) continue;
            const r = el.getBoundingClientRect();
            const mid = axis === 'y' ? (r.top + r.bottom) / 2 : (r.left + r.right) / 2;
            const d = Math.abs(p - mid);
            if (d < best) { best = d; overId = id; }
        }
        if (overId && overId !== dragId) {
            const next = cur.slice();
            const from = next.indexOf(dragId), to = next.indexOf(overId);
            if (from !== -1 && to !== -1) {
                next.splice(from, 1); next.splice(to, 0, dragId);
                orderRef.current = next;
                setOrder(next);
            }
        }
    };
    const suppressClick = useRef(false);
    const end = () => {
        clearTimer();
        startPt.current = null;
        if (dragId && orderRef.current) { onCommit(orderRef.current); suppressClick.current = true; }
        setDragId(null);
        setOrder(null);
        orderRef.current = null;
    };
    // engole o clique que vem logo após um arraste (senão abriria o item solto)
    const onClickCapture = (e) => { if (suppressClick.current) { suppressClick.current = false; e.preventDefault(); e.stopPropagation(); } };
    // handlers para o CONTAINER (captura move/up em toda a área) e para cada ITEM (down)
    const containerProps = { onPointerMove: move, onPointerUp: end, onPointerLeave: end, onPointerCancel: end, onClickCapture };
    const itemProps = (id) => ({ onPointerDown: begin(id), ref: setNode(id) });
    return { dragId, order, containerProps, itemProps };
}
